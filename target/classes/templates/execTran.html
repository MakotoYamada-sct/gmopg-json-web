<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>決済実行</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		<h2>決済実行</h2>
		<form th:action="@{/execTran}" th:object="${dto}" method="post">
			<table>
				<thead>
					<tr>
						<th>選択</th>
						<th>オーダーID</th>
						<th>会員ID</th>
						<th>金額</th>
					</tr>
				</thead>
				<tbody>
					<!-- 1件以上ある場合、一覧表示 -->
					<tr th:each="dto : ${dto}" th:if="${#lists.size(dto) > 0}">
						<td><input type="radio" name="selectOrderID" th:value="${dto.orderID}" required></td>
						<td th:text="${dto.orderID}"></td>
						<td th:text="${dto.memberID}"></td>
						<td th:text="${dto.amount}"></td>
					</tr>
				<!-- 0件の場合のメッセージ表示 -->
				<tr th:if="${#lists.isEmpty(dto)}">
					<td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">
						対象の取引データが存在しません。
					</td>
				</tr>
				</tbody>
			</table>
			<!-- dtoがnullまたは空リストの場合に disabled 属性を付与 -->
			<button type="submit" th:disabled="${#lists.isEmpty(dto)}">決済実行</button>
		</form>
		<a th:href="@{/}" class="nav-link">← メニューへ戻る</a>
	</div>
</body>
</html>
