<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>取引登録</title>
</head>

<body>
	<h2>取引登録</h2>
	<form th:action="@{/entryTran}" th:object="${dto}" method="post">
		<label>会員ID: <input type="text" th:field="*{memberID}" required placeholder="サイト管理画面で登録した会員ID" /></label><br />
		<label>金額: <input type="number" th:field="*{amount}" required /></label><br />
		<button type="submit">取引登録</button>
	</form>
	<a th:href="@{/}">メニューへ戻る</a>
</body>

</html>
