<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>取引登録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		<h2>取引登録</h2>
		<form th:action="@{/entryTran}" th:object="${dto}" method="post">
			<div class="form-group">
				<label for="memberID">会員ID</label>
				<input type="text" id="memberID" th:field="*{memberID}" required placeholder="サイト管理画面で登録した会員ID" />
			</div>
			<div class="form-group">
				<label for="amount">金額</label>
				<input type="number" id="amount" th:field="*{amount}" required />
			</div>
			<button type="submit">取引登録</button>
		</form>
		<a th:href="@{/}" class="nav-link">← メニューへ戻る</a>
	</div>
</body>
</html>
