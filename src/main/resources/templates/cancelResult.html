<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>決済取消結果</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		<h2>決済取消結果</h2>
		<div class="message-success">決済取消に成功しました。</div>
		<div class="info-grid">
			<div>オーダーID</div><div>:</div><div th:text="${dto.orderID}"></div>
			<div>会員ID</div><div>:</div><div th:text="${dto.memberID}"></div>
			<div>会員名</div><div>:</div><div th:text="${dto.memberName}"></div>
			<div>金額</div><div>:</div><div th:text="${dto.amount}"></div>
			<div>現在状態</div><div>:</div><div th:text="${dto.status}"></div>
			<div>処理日時</div><div>:</div><div th:text="${dto.processDate}"></div>
		</div>
		<a th:href="@{/}" class="nav-link">← メニューへ戻る</a>
	</div>
</body>
</html>
